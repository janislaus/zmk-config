# Current ZMK main / Zephyr 4.1 build matrix.
#
# IMPORTANT: your old config used `board: nice_nano`, which means nice!nano V1.
# On current ZMK this maps to `nice_nano@1//zmk`.
# If your controllers are actually nice!nano V2, replace every
# `nice_nano@1//zmk` below with `nice_nano//zmk`.
---
include:
  - board: nice_nano@1//zmk
    shield: skeletyl_left
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: skeletyl-left

  - board: nice_nano@1//zmk
    shield: skeletyl_right
    artifact-name: skeletyl-right

  - board: nice_nano@1//zmk
    shield: settings_reset
    artifact-name: settings-reset

  # Keebart Corne Choc Pro BT with the two integrated 160x68 Sharp MIP displays.
  # Its keymap selects a custom 36-key view of the standard 46-position matrix:
  # six outer-column switches and four display positions are ignored.
  - board: corne_choc_pro_left
    shield: sharp_mip
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: corne-choc-pro-left

  - board: corne_choc_pro_right
    shield: sharp_mip
    artifact-name: corne-choc-pro-right

  - board: corne_choc_pro_left
    shield: settings_reset
    artifact-name: corne-choc-pro-settings-reset-left

  - board: corne_choc_pro_right
    shield: settings_reset
    artifact-name: corne-choc-pro-settings-reset-right
